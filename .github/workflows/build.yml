# Build-quality CI for the work branch: every develop commit compiles the
# library (including the Avalonia XAML compilation) and runs the style-pin
# suite before it can ride a release. Publishing itself is main-only - see
# publish.yml (tags v* and manual dispatch from main).
name: build

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Pin the SDK from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Livery.csproj -c Release

      - name: Test the style pins
        run: dotnet test tests/Livery.Tests/Livery.Tests.csproj -c Release
