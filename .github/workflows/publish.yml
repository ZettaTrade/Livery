# Livery NuGet delivery: a version tag (v*) packs the library and pushes the
# package to the private GitHub Packages feed (nuget.pkg.github.com). The tag
# must ride the commit whose Livery.csproj <Version> matches the tag name
# (vX.Y.Z <-> X.Y.Z); a mismatch fails loudly instead of shipping.
#
# Releases are cut from main: cut the tag on the main release commit, or run
# this workflow manually from main (a manual run off main fails the guard).
# develop is the work branch - its CI-quality state never publishes.
#
# GITHUB_TOKEN carries packages:write - the package lands in this repository's
# namespace and inherits its private visibility. Moving to nuget.org later only
# changes the push target below (plus an API-key secret); PackageReference
# stays untouched on the consumer side.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin the SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Guard - releases ride main; the tag matches <Version>
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF_NAME -ne 'main') {
            throw "Manual publish runs from 'main' only (got '$env:GITHUB_REF_NAME'). Releases are cut from main; develop is the work branch."
          }
          if ($env:GITHUB_REF_NAME.StartsWith('v')) {
            $csproj = Get-Content -Raw Livery.csproj
            $version = [regex]::Match($csproj, '<Version>([^<>]+)</Version>').Groups[1].Value.Trim()
            if (-not $version) { throw 'Livery.csproj carries no <Version>.' }
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag '$env:GITHUB_REF_NAME' does not match Livery.csproj version '$version' (v$version)."
            }
            Write-Host "Tag '$env:GITHUB_REF_NAME' matches Version $version."
          }
          else {
            Write-Host "Manual publish from 'main': Version comes from Livery.csproj."
          }

      - name: Pack
        run: dotnet pack Livery.csproj -c Release -o dist

      - name: Push to GitHub Packages
        run: dotnet nuget push "dist/*.nupkg" --source https://nuget.pkg.github.com/ZettaTrade/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
